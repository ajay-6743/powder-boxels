html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--ln)}
h1{font-size:15px;margin:0 auto 0 0}
#st{color:var(--ac)}
#tools,#tabs{display:flex;gap:6px}
label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit;color:var(--ink)}
button,select{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:5px 9px;cursor:pointer}
button.on{outline:2px solid var(--ac);outline-offset:-1px}
#wrap{flex:1;min-height:0;position:relative;background:var(--cv)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#hint{position:absolute;inset:0;display:grid;place-items:center;color:#8d8d9c;pointer-events:none;text-align:center;padding:16px}
#tabs{padding:6px 10px 0;background:var(--pn);border-top:1px solid var(--ln);overflow-x:auto}
#tabs button{flex:none}
#ps{padding:5px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);min-width:90px}
#pal{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 8px;max-height:104px;overflow:auto;background:var(--pn)}
i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;border:1px solid #0004;flex:none}
dialog{background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:12px;width:min(520px,92vw);max-height:80vh;padding:12px}
dialog[open]{display:flex;flex-direction:column;gap:8px}
#q{padding:7px 9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
#ls{overflow:auto;max-height:52vh}
.r{display:flex;align-items:flex-start;gap:4px;padding:6px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.r i{margin-top:4px}
.r small{display:block;opacity:.7}
</style>

function fit(){
  const r=wrap.getBoundingClientRect(),cs=innerWidth<640?3:4,nw=Math.max(40,r.width/cs|0),nh=Math.max(40,r.height/cs|0);
  if(nw===W&&nh===H)return;
  const n=nw*nh,G=new Uint16Array(n),A=new Uint16Array(n),V=new Uint8Array(n),Tn=new Float32Array(n).fill(20);
  for(let y=0;y<Math.min(H,nh);y++)for(let x=0;x<Math.min(W,nw);x++){const s=(H-1-y)*W+x,d=(nh-1-y)*nw+x;G[d]=g[s];A[d]=a[s];V[d]=v[s];Tn[d]=T[s]}
  W=nw;H=nh;g=G;a=A;v=V;T=Tn;m=new Uint8Array(n);
  cv.width=W;cv.height=H;img=ctx.createImageData(W,H);px=new Uint32Array(img.data.buffer);
}

// painting
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W|0,(e.clientY-r.top)/r.height*H|0]};
function stamp(cx,cy){
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dy*dy>R*R+R||!inb(cx+dx,cy+dy))continue;
    const i=(cy+dy)*W+cx+dx;
    if(sel<0){if(g[i])T[i]=Math.max(-273,Math.min(5000,T[i]+(sel===-1?60:-60)))}
    else if(!sel)put(i,0);
    else if(!g[i]&&(TY[sel]===4||rnd()<.35))put(i,sel);
  }
}
function line(x0,y0,x1,y1){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let k=0;k<=n;k++)stamp(x0+(x1-x0)*k/n|0,y0+(y1-y0)*k/n|0)}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);down=1;[lx,ly]=pos(e);$('hint').style.display='none'};
cv.onpointermove=e=>{if(!down)return;const[x,y]=pos(e);line(lx,ly,x,y);lx=x;ly=y};
cv.onpointerup=cv.onpointercancel=()=>{down=0};

// interface
const pal=$('pal'),tabs=$('tabs'),note=s=>{$('st').textContent=s;clearTimeout(nt);nt=setTimeout(()=>$('st').textContent='',1800)};
function pick(i){sel=i;document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===i))}
function mk(i,name,col,k,par){
  const b=document.createElement('button');b.dataset.i=i;b.dataset.k=k;
  b.innerHTML='<i style="background:#'+col+'"></i>'+name;b.onclick=()=>pick(i);par.appendChild(b);
}
mk(0,'Erase','666',0,$('tools'));mk(-1,'Heat','ff6a2a',0,$('tools'));mk(-2,'Cold','5ac8ff',0,$('tools'));
const TB=['Powders','Liquids','Solids','Gases','Special','Life','Food','Elements','Salts','Organic','Minerals','Alloys','Chemicals'];
let cur='Powders';
const ps=document.createElement('input');ps.id='ps';ps.placeholder='Filter';ps.autocomplete='off';
function render(){
  pal.textContent='';let n=0,t=0;const q=ps.value.toLowerCase();
  for(let i=1;i<E.length;i++){const e=E[i];if(e[3]!==cur||q&&!e[0].toLowerCase().includes(q))continue;t++;if(n<300){mk(i,e[0],e[1],e[2],pal);n++}}
  if(t>n){const s=document.createElement('small');s.textContent='+'+(t-n)+' more: use Filter or Lookup';pal.appendChild(s)}
  document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===sel));
}
function go(c){cur=c;[...tabs.children].forEach(b=>b.classList.toggle('on',b.textContent===c));render()}
TB.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(n);tabs.appendChild(b)});
tabs.appendChild(ps);ps.oninput=render;go('Powders');pick(1);

const KN=['Tool','Powder','Liquid','Gas','Solid'];
function info(t){
  const nm=n=>n?E[n][0]:'nothing',s=[KN[TY[t]]];
  if(TY[t]<4)s.push('density '+D[t]);
  if(T0[t]!==20)s.push('starts at '+T0[t]+'°C');
  if(KT[t]>-999)s.push('holds '+KT[t]+'°C');
  if(HT[t]<1e9)s.push('above '+HT[t]+'°C becomes '+nm(HN[t]));
  if(CT[t]>-1e9)s.push('below '+CT[t]+'°C becomes '+nm(CN[t]));
  if(IG[t]<1e9)s.push((EX[t]?'explodes above ':'burns above ')+IG[t]+'°C');
  if(AC[t])s.push('dissolves solids and powders');
  if(PL[t])s.push('grows into water');
  if(SP[t])s.push('emits '+nm(SP[t]));
  if(CLN[t])s.push('copies a touching element');
  if(VD[t])s.push('deletes what touches it');
  if(RS[t])s.push('resists acid and blasts');
  if(LF[t])s.push('fades into '+nm(LN[t]));
  if(WK[t])s.push(['','walks','swims','flies'][WK[t]]);
  if(DK[t])s.push((DH[t]?'radioactive, decays into ':'dies of old age into ')+nm(DK[t]));
  const rx=[];RX.forEach((r,q)=>{if((q/K|0)===t)rx.push(nm(q%K))});
  if(rx.length)s.push('reacts with '+rx.slice(0,14).join(', ')+(rx.length>14?' +'+(rx.length-14)+' more':''));
  return s.join(', ');
}
const ls=$('ls');
function look(){
  const q=$('q').value.toLowerCase().trim();ls.textContent='';let n=0;
  for(let i=1;i<E.length&&n<120;i++){const e=E[i];if(q&&!(e[0].toLowerCase().includes(q)||e[3].toLowerCase()===q))continue;n++;
    const d=document.createElement('div');d.className='r';
    d.innerHTML='<i style="background:#'+e[1]+'"></i><div><b>'+e[0]+'</b> <small>'+e[3]+'</small><small>'+info(i)+'</small></div>';
    d.onclick=()=>{pick(i);ps.value=e[0];go(e[3]);$('lk').close()};
    ls.appendChild(d)}
}
$('lu').onclick=()=>{$('lk').showModal();$('q').value='';look();$('q').focus()};
$('q').oninput=look;
$('xx').onclick=()=>$('lk').close();

$('br').oninput=e=>{R=+e.target.value};
$('pz').onclick=()=>{paused^=1;$('pz').textContent=paused?'Play':'Pause'};
$('cl').onclick=()=>{g.fill(0);a.fill(0);T.fill(20)};
$('sv').onclick=()=>{
  const r=[];let p=g[0],c=0;
  for(let i=0;i<g.length;i++){if(g[i]===p&&c<60000)c++;else{r.push(p,c);p=g[i];c=1}}
  r.push(p,c);
  try{localStorage.setItem('pb'+$('sl').value,JSON.stringify({W,H,r}));note('Saved to slot '+$('sl').value)}catch(e){note('Save failed')}
};
$('ld').onclick=()=>{
  try{
    const s=JSON.parse(localStorage.getItem('pb'+$('sl').value));
    if(!s){note('Slot '+$('sl').value+' is empty');return}
    const G=new Uint16Array(s.W*s.H);let k=0;
    for(let q=0;q<s.r.length;q+=2){G.fill(s.r[q],k,k+s.r[q+1]);k+=s.r[q+1]}
    g.fill(0);a.fill(0);T.fill(20);
    for(let y=0;y<Math.min(H,s.H);y++)for(let x=0;x<Math.min(W,s.W);x++){
      const t=G[(s.H-1-y)*s.W+x];if(t)put((H-1-y)*W+x,t);
    }
    note('Loaded slot '+$('sl').value);
  }catch(e){note('Load failed')}
};

document.querySelector('h1').textContent='Powder Box \u00b7 '+(E.length-1).toLocaleString()+' elements';
fit();new ResizeObserver(fit).observe(wrap);
(function loop(){if(down)line(lx,ly,lx,ly);if(!paused)step();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
